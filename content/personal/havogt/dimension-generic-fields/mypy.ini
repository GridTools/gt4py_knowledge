# Standalone mypy configuration for the typed-dimensions prototype:
# deliberately *without* the gt4py mypy plugin — the point of the prototype is
# that the redesigned Dimension needs no plugin support.
[mypy]
python_version = 3.10
strict_equality = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_untyped_defs = True
no_implicit_optional = True
